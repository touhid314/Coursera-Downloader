name: Install command test

# Installs the latest published release with install-macos.sh (Apple silicon
# and Intel Macs) and install-linux.sh (Ubuntu), as users do, and checks that
# the installed app starts.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: Install on macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Run the install command
        env:
          COURSERA_DL_NO_OPEN: "1"
        run: bash install-macos.sh

      - name: Check the installed app
        run: |
          app="/Applications/Coursera Downloader.app"
          binary="$app/Contents/MacOS/CourseraDownloader"
          file "$binary" | grep -q "${{ matrix.arch }}"
          # No quarantine flag: macOS opens the app without a security warning.
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then
            echo "The installed app is quarantined"; exit 1
          fi
          codesign --verify --deep --strict "$app"
          "$binary" --smoke-test | tee smoke.log
          grep -q "SMOKE TEST OK" smoke.log

      - name: Run it again to update an existing installation
        env:
          COURSERA_DL_NO_OPEN: "1"
        run: |
          bash install-macos.sh
          test -d "/Applications/Coursera Downloader.app"

      - name: Update through Terminal, as the app's Update button does
        run: |
          app="/Applications/Coursera Downloader.app"
          rm -rf "$app"
          # The app writes this .command file and opens it with Terminal.
          script=$(python3 - <<'EOF'
          import sys, types
          for name in ("rookiepy", "keyring", "requests"):
              sys.modules[name] = types.ModuleType(name)
          from src.services.general import write_macos_update_script
          print(write_macos_update_script())
          EOF
          )
          echo "Update script: $script"
          cat "$script"
          open -a Terminal "$script"
          # The script reinstalls the app and then deletes itself.
          for _ in $(seq 1 90); do
            if [ -d "$app" ] && [ ! -e "$script" ]; then break; fi
            sleep 2
          done
          test -d "$app" || { echo "Terminal did not install the app"; exit 1; }
          test ! -e "$script" || { echo "The update script did not finish"; exit 1; }
          pkill -x CourseraDownloader || true

  linux:
    name: Install on Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Run the install command
        env:
          COURSERA_DL_NO_OPEN: "1"
        run: bash install-linux.sh

      - name: Check the installed app
        run: |
          test -f "$HOME/.local/share/applications/coursera-downloader.desktop"
          xvfb-run -a "$HOME/.local/bin/coursera-downloader" --smoke-test | tee smoke.log
          grep -q "SMOKE TEST OK" smoke.log

      - name: Run it again to update an existing installation
        env:
          COURSERA_DL_NO_OPEN: "1"
        run: |
          bash install-linux.sh
          test -x "$HOME/.local/share/coursera-downloader/CourseraDownloader"
