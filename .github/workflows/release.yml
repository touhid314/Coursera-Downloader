name: Release

# Pushing a v* tag builds the Windows and macOS apps and publishes them as a
# GitHub release. Running the workflow by hand (Actions → Release → Run
# workflow) builds and tests everything without publishing; the builds are
# then available as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify the tag and run tests
        shell: pwsh
        run: |
          $version = python -c "import src; print(src.__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $version"
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          python -m unittest discover -s tests -v

      - name: Build the portable application
        run: >-
          python -m PyInstaller release/config/pyinstaller.spec
          --noconfirm --clean
          --distpath release/artifacts/app
          --workpath release/work

      - name: Smoke-test a copy of the built app
        shell: pwsh
        run: |
          # A copy, so that the packaged settings file stays untouched.
          $copy = Join-Path $env:RUNNER_TEMP "smoke-app"
          Copy-Item "release/artifacts/app/CourseraDownloader" $copy -Recurse
          $app = Start-Process (Join-Path $copy "CourseraDownloader.exe") `
            -ArgumentList "--smoke-test" -Wait -PassThru
          if ($app.ExitCode -ne 0) {
            throw "The smoke test failed with exit code $($app.ExitCode)"
          }

      - name: Create the portable ZIP
        shell: pwsh
        run: |
          $zip = "release/artifacts/CourseraDownloader-v$env:VERSION-win64.zip"
          Compress-Archive `
            -Path "release/artifacts/app/CourseraDownloader" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc "release\config\installer.iss"

      - name: Collect the downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          Copy-Item "release/artifacts/installers/*.exe" downloads/
          Copy-Item "release/artifacts/*.zip" downloads/

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: downloads/*
          if-no-files-found: error

  macos:
    name: macOS build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify the tag and run tests
        run: |
          version=$(python -c "import src; print(src.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -v

      - name: Build the app
        run: >-
          python -m PyInstaller release/config/pyinstaller.spec
          --noconfirm --clean
          --distpath release/artifacts/app
          --workpath release/work

      - name: Check the app bundle
        run: |
          app="release/artifacts/app/CourseraDownloader.app"
          binary="$app/Contents/MacOS/CourseraDownloader"
          file "$binary"
          file "$binary" | grep -q "${{ matrix.arch }}"
          plutil -p "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          icon=$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")
          ls -l "$app/Contents/Resources/$icon"
          # PyInstaller signs the app ad hoc; Apple Silicon Macs refuse to
          # run unsigned code.
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Create the disk image
        run: |
          dmg="release/artifacts/CourseraDownloader-v$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="release/work/dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          ditto "release/artifacts/app/CourseraDownloader.app" "$staging/Coursera Downloader.app"
          ln -s /Applications "$staging/Applications"
          # hdiutil sometimes fails with "Resource busy" on GitHub's runners.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Coursera Downloader" -srcfolder "$staging" \
              -ov -format UDZO "$dmg"; then
              break
            fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Install from the disk image and test the installed app
        run: |
          mount=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$mount"
          rm -rf "/Applications/Coursera Downloader.app"
          ditto "$mount/Coursera Downloader.app" "/Applications/Coursera Downloader.app"
          hdiutil detach "$mount"

          app="/Applications/Coursera Downloader.app"
          codesign --verify --deep --strict "$app"
          settings="$HOME/Library/Application Support/CourseraDownloader/data.bin"
          rm -f "$settings"

          mkdir -p screenshots
          SMOKE_TEST_SECONDS=12 "$app/Contents/MacOS/CourseraDownloader" --smoke-test > smoke.log 2>&1 &
          pid=$!
          sleep 9
          screencapture -x screenshots/main-window.png || true
          wait "$pid" || true
          cat smoke.log
          grep -q "SMOKE TEST OK" smoke.log
          test -f "$settings"
          # Settings must not be written into the signed bundle.
          codesign --verify --deep --strict "$app"

      - name: Test the embedded login window
        run: |
          # The window opens Coursera's login page and waits for a login. It
          # must still be running, without reporting an error, after a while.
          app="/Applications/Coursera Downloader.app"
          result=$(mktemp)
          export SMOKE_TEST_COOKIE_NAMES_FILE=$(mktemp)
          "$app/Contents/MacOS/CourseraDownloader" --webview-login --webview-result "$result" &
          pid=$!
          sleep 30
          screencapture -x screenshots/login-window.png || true
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "The login window exited early:"; cat "$result"; exit 1
          fi
          kill "$pid"
          if grep -q "COURsera_ERROR" "$result"; then
            echo "The login window reported an error:"; cat "$result"; exit 1
          fi
          # The app finds the login by reading the window's cookies; Coursera
          # sets some even before anyone logs in.
          echo "Cookies the login window could read:"
          cat "$SMOKE_TEST_COOKIE_NAMES_FILE"; echo
          test -s "$SMOKE_TEST_COOKIE_NAMES_FILE"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.arch }}
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error

  linux:
    name: Linux build (x86_64)
    # The oldest supported runner, so the app also runs on older distributions.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install the system libraries Qt needs, and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libasound2 libdbus-1-3 \
            xvfb xauth imagemagick

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify the tag and run tests
        run: |
          version=$(python -c "import src; print(src.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python -m unittest discover -s tests -v

      - name: Build the app
        run: >-
          python -m PyInstaller release/config/pyinstaller.spec
          --noconfirm --clean
          --distpath release/artifacts/app
          --workpath release/work

      - name: Create the archive
        run: |
          # Needed by the login window on minimal systems such as WSL.
          ls -l release/artifacts/app/CourseraDownloader/_internal/libwayland-server.so.0
          archive="release/artifacts/CourseraDownloader-v$VERSION-linux-x86_64.tar.gz"
          tar -czf "$archive" -C release/artifacts/app CourseraDownloader
          ls -l "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Install with install-linux.sh and test the installed app
        run: |
          COURSERA_DL_ARCHIVE="$ARCHIVE" COURSERA_DL_NO_OPEN=1 bash install-linux.sh
          test -x "$HOME/.local/bin/coursera-downloader"
          test -f "$HOME/.local/share/applications/coursera-downloader.desktop"
          settings="$HOME/.local/share/CourseraDownloader/data.bin"
          rm -f "$settings"

          mkdir -p screenshots
          cat > "$RUNNER_TEMP/gui-test.sh" <<'EOF'
          set -e
          app="$HOME/.local/bin/coursera-downloader"
          SMOKE_TEST_SECONDS=12 "$app" --smoke-test > smoke.log 2>&1 &
          pid=$!
          sleep 9
          import -window root screenshots/main-window.png || true
          wait "$pid" || true

          result=$(mktemp)
          export SMOKE_TEST_COOKIE_NAMES_FILE=$(mktemp)
          "$app" --webview-login --webview-result "$result" > login.log 2>&1 &
          pid=$!
          sleep 40
          import -window root screenshots/login-window.png || true
          alive=yes
          kill -0 "$pid" 2>/dev/null || alive=no
          kill "$pid" 2>/dev/null || true
          echo "$alive" > login-alive.txt
          cp "$result" login-result.txt
          cp "$SMOKE_TEST_COOKIE_NAMES_FILE" login-cookies.txt
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" bash "$RUNNER_TEMP/gui-test.sh"

          cat smoke.log
          grep -q "SMOKE TEST OK" smoke.log
          test -f "$settings"
          echo "Login window output:"; cat login.log
          test "$(cat login-alive.txt)" = yes || { echo "The login window exited early"; cat login-result.txt; exit 1; }
          if grep -q "COURsera_ERROR" login-result.txt; then
            echo "The login window reported an error:"; cat login-result.txt; exit 1
          fi
          echo "Cookies the login window could read:"; cat login-cookies.txt; echo
          test -s login-cookies.txt

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: downloads
          pattern: "{windows,macos-*,linux-*}"
          merge-multiple: true

      - name: Write SHA-256 checksums
        working-directory: downloads
        run: |
          sha256sum --binary *.exe *.zip *.dmg *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(downloads/*.exe downloads/*.zip downloads/*.dmg downloads/*.tar.gz downloads/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            # The release was already created, for example by hand: add or
            # replace the downloads.
            gh release upload "$tag" "${files[@]}" --clobber
          else
            notes=(--generate-notes)
            if [ -f "release/notes/$tag.md" ]; then
              notes=(--notes-file "release/notes/$tag.md")
            fi
            gh release create "$tag" "${files[@]}" --verify-tag \
              --title "Coursera Full Course Downloader $tag" "${notes[@]}"
          fi

  macos-install:
    name: Test the macOS install command
    needs: publish
    uses: ./.github/workflows/macos-install-test.yml
